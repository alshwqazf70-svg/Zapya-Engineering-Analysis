name: Analyze Zapya APK (private)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-apk.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private analysis repository
        uses: actions/checkout@v4

      - name: Install APK decoding tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip jq file binutils llvm

      - name: Download JADX release
        shell: bash
        run: |
          set -euo pipefail
          api="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest)"
          url="$(printf '%s' "$api" | jq -r '[.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$"))][0].browser_download_url // empty')"
          test -n "$url"
          mkdir -p tools
          curl -fL "$url" -o tools/jadx.zip
          unzip -q tools/jadx.zip -d tools/jadx
          JADX="$(find tools/jadx -type f -path '*/bin/jadx' | head -n 1)"
          test -n "$JADX"
          chmod +x "$JADX"
          echo "JADX=$JADX" >> "$GITHUB_ENV"

      - name: Verify original APK and decode manifest/resources
        run: |
          set -euo pipefail
          mkdir -p reports/generated decoded
          echo "## Artifact verification" > reports/generated/ANALYSIS-REPORT.md
          sha256sum apk/Zapya.apk | tee reports/generated/ACTUAL-SHA256.txt
          diff -u inventory/SHA256.txt reports/generated/ACTUAL-SHA256.txt
          file apk/Zapya.apk >> reports/generated/ANALYSIS-REPORT.md
          unzip -l apk/Zapya.apk > reports/generated/ARCHIVE-LIST.txt
          apktool d -f apk/Zapya.apk -o decoded/apktool
          cp decoded/apktool/AndroidManifest.xml reports/generated/AndroidManifest-decoded.xml
          {
            echo
            echo "## Manifest highlights"
            grep -Eo 'package="[^"]+"|android:(versionCode|versionName|minSdkVersion|targetSdkVersion)="[^"]+"' reports/generated/AndroidManifest-decoded.xml | sort -u || true
            echo
            echo "## Declared components"
            grep -Eo '<(activity|activity-alias|service|receiver|provider)[^>]*' reports/generated/AndroidManifest-decoded.xml | head -n 250 || true
            echo
            echo "## Permissions"
            grep -Eo '<uses-permission[^>]*' reports/generated/AndroidManifest-decoded.xml | sort -u || true
          } >> reports/generated/ANALYSIS-REPORT.md

      - name: Decompile DEX files with JADX
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p decoded/jadx reports/generated
          set +e
          "$JADX" --show-bad-code -d decoded/jadx apk/Zapya.apk 2>&1 | tee reports/generated/JADX-LOG.txt
          jadx_status=${PIPESTATUS[0]}
          set -e
          source_count="$(find decoded/jadx -type f -name '*.java' 2>/dev/null | wc -l)"
          echo "JADX exit code: ${jadx_status}" > reports/generated/JADX-STATUS.txt
          echo "Recovered Java source files: ${source_count}" >> reports/generated/JADX-STATUS.txt
          if [ "$source_count" -eq 0 ]; then
            echo "JADX produced no Java sources; cannot continue analysis." >&2
            exit 1
          fi
          if [ "$jadx_status" -ne 0 ]; then
            echo "JADX reported recoverable decompilation errors; continuing with recovered sources." | tee -a reports/generated/JADX-STATUS.txt
          fi

      - name: Extract networking and transfer investigation leads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/generated
          {
            echo "# Code search leads (not conclusions)"
            echo
            echo "Search hits are investigation leads; each behavior must be confirmed by tracing callers and runtime behavior."
            echo
            grep -RniE 'WifiP2p|WiFiDirect|WifiManager|LocalOnlyHotspot|Bluetooth|NsdManager|MulticastLock|ServerSocket|SocketChannel|DatagramSocket|OkHttp|Retrofit|ForegroundService|startForeground|WorkManager|MD5|SHA-256|CRC32|retry|resume|offset|chunk|nstackx|nearby' decoded/jadx --include='*.java' 2>/dev/null | head -n 2500 > reports/generated/NETWORK-TRANSFER-HITS.txt || true
            find apk -type f -maxdepth 2 -print
          } > reports/generated/SEARCH-NOTES.txt
          {
            echo
            echo "## Decompiled code search"
            echo "See NETWORK-TRANSFER-HITS.txt for keyword matches requiring manual call-graph review."
            echo
            echo "## Native library inventory"
            grep -E 'lib/[^ ]+\\.so' reports/generated/ARCHIVE-LIST.txt | head -n 100 || true
          } >> reports/generated/ANALYSIS-REPORT.md

      - name: Inspect native libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p decoded/native reports/generated/native
          unzip -oq apk/Zapya.apk 'lib/*' -d decoded/native
          while IFS= read -r so; do
            base="$(basename "$so")"
            strings -a "$so" > "reports/generated/native/$base.strings.txt"
            readelf -Ws "$so" > "reports/generated/native/$base.symbols.txt" || true
          done < <(find decoded/native -type f -name '*.so' | sort)
          grep -RniE 'wifi|p2p|nearby|nstackx|socket|bluetooth|discovery|transfer|mdns|bonjour|hotspot|http' reports/generated/native > reports/generated/NATIVE-SEARCH-HITS.txt || true

      - name: Disassemble targeted native transfer and crypto symbols
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports/generated/native-disassembly
          symbols='KCP_Create,KCP_Config,KCP_Send,KCP_Recv,KCP_UpdatePeriodic,KCP_Destroy,NSTACKX_DFileClient,NSTACKX_DFileServer,NSTACKX_DFileSendFiles,NSTACKX_DFileSendFilesWithRemotePath,NSTACKX_DMsgClient,NSTACKX_DMsgServer,NSTACKX_DMsgSendData,NSTACKX_DMsgSendDataWithPeerACK,DMsgSendKcpNegoResponse,SendDataBlock,AesGcmEncrypt,AesGcmDecrypt,CreatNormalDataFrame,CreateRetranDataFrame,WriteBlockFrame,EncodeFileDataAckFrame,DecodeFileDataAckFrame,DecodeFileDataAckFrameUnderSecondVersion,EncodeFileTransferDoneAckFrame,HandleDFileFrame,FileManagerSendFileTask,FileManagerSendRetranList,FileManagerRecvFileTask,DFileTransSendFiles,DFileStartTrans,DFileSenderHandle,DFileReceiverHandle,CreateEncryptDMsgDataUnit,StartHeartBeatClient,StartHeartBeatServer,UpdateAllTransRetryCount,AddRecordToUnAckInfo,AdjustAckInterval,AdjustClientSendRateByAckDrop,AdjustWlanSendRate,AdjustP2PSendRate'
          command -v llvm-objdump
          while IFS= read -r so; do
            abi="$(basename "$(dirname "$so")")"
            base="$(basename "$so")"
            out="reports/generated/native-disassembly/${abi}-${base}.disasm.txt"
            case "$abi" in
              armeabi-v7a) triple_args=(--triple=thumbv7-linux-android) ;;
              arm64-v8a) triple_args=(--triple=aarch64-linux-android) ;;
              x86) triple_args=(--triple=i686-linux-android) ;;
              x86_64) triple_args=(--triple=x86_64-linux-android) ;;
              *) triple_args=() ;;
            esac
            echo "### ABI: $abi | file: $so" > "$out"
            llvm-objdump "${triple_args[@]}" --disassemble --demangle --disassemble-symbols="$symbols" "$so" >> "$out" 2>&1 || true
            echo "### Defined symbols" >> "$out"
            readelf -Ws "$so" | grep -E 'KCP_|NSTACKX_D(File|Msg)|AesGcm|Ack|ACK|HeartBeat|Retry|UnAck|SendRate|FileManager|CreatNormal|WriteBlockFrame|SendDataBlock' >> "$out" || true
          done < <(find decoded/native -type f -name '*.so' | sort)
          find reports/generated/native-disassembly -type f -size +0c -print

      - name: Package analysis outputs
        run: |
          set -euo pipefail
          mkdir -p output
          cp -r reports/generated output/
          cp -r decoded/apktool output/
          cp -r decoded/jadx/sources output/jadx-sources
          cp -r reports/generated/native output/native-analysis
          cp -r reports/generated/native-disassembly output/native-disassembly
          cd output
          zip -qr ../zapya-analysis-results.zip .

      - name: Upload private analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapya-analysis-results
          path: zapya-analysis-results.zip
          retention-days: 7
